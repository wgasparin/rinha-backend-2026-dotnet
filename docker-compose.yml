services:
  api-1: &api
    image: gasparin/rinha-backend-2026@sha256:ef5423c6aed39de968222c60c367f87da18d78f6bf2d59a42a99705cef3c4451
    platform: linux/amd64
    restart: unless-stopped
    networks:
      - rinha-net
    deploy:
      resources:
        limits:
          memory: '160M'
          cpus: "0.45"

  api-2:
    <<: *api

  haproxy:
    image: haproxy:3.0-alpine
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      - api-1
      - api-2
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - rinha-net
    deploy:
      resources:
        limits:
          memory: '30M'
          cpus: "0.10"

networks:
  rinha-net:
    driver: bridge
